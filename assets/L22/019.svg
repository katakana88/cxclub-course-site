    <!-- 底部实战训练提示 -->
    <g transform="translate(60, 205)">
      <rect x="0" y="0" width="760" height="135" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="25" y="30" fill="#58a6ff" font-size="14" font-weight="bold">每日经验实战训练要点：</text>
      <text x="25" y="60" fill="#c9d1d9" font-size="12">1. 检查当真：凡是当真、自动反应、反复循环的，皆为催眠盲点。</text>
      <text x="25" y="85" fill="#c9d1d9" font-size="12">2. 顺藤摸瓜：逆向剥离层级 (n → n-1)，不增加新观点，只解除现有预设。</text>
      <text x="25" y="110" fill="#c9d1d9" font-size="12">3. 保持自主：进退自由，不被诱惑引导，不被恐惧绑架，恢复绝对自由意识。</text>
