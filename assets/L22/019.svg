      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第16课：答疑复盘</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">前15课策略与原则综合答疑与案例剖析</text>
    </g>
    <!-- 附加说明 -->
