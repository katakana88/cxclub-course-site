<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1320" width="100%" height="100%" style="background-color: #0d1117; font-family: &#39;Microsoft YaHei&#39;, sans-serif;">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="nodeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd561d" />
      <stop offset="100%" stop-color="#db6d28" />
    </linearGradient>
    <linearGradient id="coreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1800" height="1320" fill="url(#bgGrad)" />

  <!-- 网格纹理背景辅助 -->
  <g stroke="#30363d" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.2">
    <line x1="0" y1="330" x2="1800" y2="330" />
    <line x1="0" y1="660" x2="1800" y2="660" />
    <line x1="0" y1="990" x2="1800" y2="990" />
    <line x1="450" y1="0" x2="450" y2="1320" />
    <line x1="900" y1="0" x2="900" y2="1320" />
    <line x1="1350" y1="0" x2="1350" y2="1320" />
  </g>

  <!-- ================= 连线层：融合中心向四周辐射与严谨逻辑流 ================= -->
  <!-- 中央本源枢纽向四列板块发散连线 -->
  <path d="M 900 175 L 230 310" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" opacity="0.7" />
  <path d="M 900 175 L 680 310" stroke="#da3633" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" opacity="0.7" />
  <path d="M 900 175 L 1120 310" stroke="#db6d28" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" opacity="0.7" />
  <path d="M 900 175 L 1570 310" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)" opacity="0.7" />
  
  <!-- 中央枢纽到底部面板的向下贯通连线 -->
  <path d="M 900 200 L 900 910" stroke="#d29922" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" opacity="0.8" />

  <!-- 跨模块逆向拆层闭环曲线 -->
  <path d="M 740 850 Q 1150 940 1560 850" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-green)" />
  <text x="1150" y="890" fill="#3fb950" font-size="14" text-anchor="middle" font-weight="bold">逆向拆层与两头开放：从“两头堵死”破局回归本源 (第17-21课)</text>


  <!-- ================= 核心顶点：本源枢纽 (中心发散点) ================= -->
  <g transform="translate(900, 140)" filter="url(#shadow)">
    <!-- 多边形核心形状 -->
    <polygon points="0,-60 65,-20 40,50 -40,50 -65,-20" fill="url(#coreGold)" stroke="#f0883e" stroke-width="2" />
    <text x="0" y="-8" fill="#161b22" font-size="16" font-weight="bold" text-anchor="middle">万物本源枢纽</text>
    <text x="0" y="16" fill="#161b22" font-size="12" font-weight="bold" text-anchor="middle">无形无相 / 自由意识</text>
  </g>


  <!-- ================= 四列卡片垂直阵列 (源自 Gemini 严谨逻辑) ================= -->

  <!-- 列一：第一模块 (本源与轮回认知：第1-7课) -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="300" height="580" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" opacity="0.95" />
    <rect x="0" y="0" width="300" height="45" rx="12" fill="#21262d" />
    <text x="150" y="28" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">一、本源、轮回与意识循环</text>

