      <circle cx="20" cy="27" r="6" fill="#3fb950" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第20课：觉察辨识力</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">精细辨识真假混合与客观事实推导</text>
