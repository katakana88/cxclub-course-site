      <text x="20" y="120" fill="#c9d1d9" font-size="11">• 100±1：100%真话引导自发完成最后一步</text>
      <text x="20" y="150" fill="#c9d1d9" font-size="11">• 本质：不是别人关门，是自己把门锁上</text>
      <text x="20" y="180" fill="#c9d1d9" font-size="11">• 突破口：看穿诱惑与恐惧，恢复自主权</text>
    </g>
  </g>


  <!-- 列四：第四模块 (催醒实战与破幻：第17-21课) -->
  <g transform="translate(1430, 290)">
