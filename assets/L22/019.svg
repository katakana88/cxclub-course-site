      <text x="40" y="42" fill="#8b949e" font-size="11">多维度的意识循环，自主意识 vs 自动意识</text>
    </g>
    <!-- 节点4 -->
    <g transform="translate(20, 275)" filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="55" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="20" cy="27" r="6" fill="#58a6ff" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第6-7课：本源、游戏与当真</text>
