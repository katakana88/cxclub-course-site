      <rect x="0" y="0" width="260" height="210" rx="8" fill="#1f242c" stroke="#30363d" stroke-width="1" />
      <text x="20" y="30" fill="#58a6ff" font-size="13" font-weight="bold">【核心经验结晶】</text>
      <text x="20" y="60" fill="#c9d1d9" font-size="11">• 自由意识：本源的无尽自发幻想</text>
      <text x="20" y="90" fill="#c9d1d9" font-size="11">• 零能量空间：能量闭环守恒原理</text>
      <text x="20" y="120" fill="#c9d1d9" font-size="11">• 认清规则：认真不可当真，当真即入幻</text>
      <text x="20" y="150" fill="#c9d1d9" font-size="11">• 参与角色：创造者、玩家与 NPC</text>
      <text x="20" y="180" fill="#c9d1d9" font-size="11">• 退出特权：不想要可随时自由撤出</text>
    </g>
  </g>


  <!-- 列二：第二模块 (催眠的机制与递归结构：第8-13课) -->
  <g transform="translate(530, 290)">
    <rect x="0" y="0" width="300" height="580" rx="12" fill="#161b22" stroke="#da3633" stroke-width="1.5" opacity="0.95" />
    <rect x="0" y="0" width="300" height="45" rx="12" fill="#21262d" />
