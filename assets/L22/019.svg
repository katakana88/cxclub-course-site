  <!-- ================= 底部全景面板：经验体系对照与核心公式 (源自 Gemini 版) ================= -->
  <g transform="translate(80, 910)">
    <rect x="0" y="0" width="1640" height="370" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    
    <text x="40" y="40" fill="#ffffff" font-size="16" font-weight="bold">《催醒俱乐部》第 1–21 课阶段全景经验体系总纲对照：</text>
    
    <!-- 左侧图例指引 -->
    <circle cx="60" cy="85" r="8" fill="#da3633" />
    <text x="85" y="90" fill="#c9d1d9" font-size="13">催眠系统（玩我）：定向扭曲、多级递归、真假阈值、两头堵死 (第1-16课)</text>

