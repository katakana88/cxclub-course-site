      <circle cx="20" cy="27" r="6" fill="#db6d28" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第15课：催眠策略</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">最常用策略：“两头堵死” (诱惑 + 恐惧)</text>
