    <!-- 节点1 -->
    <g transform="translate(20, 65)" filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="55" rx="8" fill="#21262d" stroke="#da3633" stroke-width="1" />
      <circle cx="20" cy="27" r="6" fill="#f85149" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第8课：造幻 vs 催眠</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">造幻=出题与创造；催眠=造幻+入幻(玩我)</text>
    </g>
    <!-- 节点2 -->
    <g transform="translate(20, 135)" filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="55" rx="8" fill="#21262d" stroke="#da3633" stroke-width="1" />
      <circle cx="20" cy="27" r="6" fill="#f85149" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第9课：催眠 + 轮回</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">催眠轮回 vs 自由轮回，地球催眠机制</text>
    </g>
    <!-- 节点3 -->
    <g transform="translate(20, 205)" filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="55" rx="8" fill="#21262d" stroke="#da3633" stroke-width="1" />
      <circle cx="20" cy="27" r="6" fill="#f85149" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第10-11课：放大、缩小与递归</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">多重递归算法 a_n → A_n+ / A_n-</text>
    </g>
    <!-- 节点4 -->
    <g transform="translate(20, 275)" filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="55" rx="8" fill="#21262d" stroke="#da3633" stroke-width="1" />
      <circle cx="20" cy="27" r="6" fill="#f85149" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">催眠AI系统架构</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">扭曲有限 + 当真无限，自动化多星球脑控</text>
