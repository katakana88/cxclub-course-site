      <text x="20" y="30" fill="#f85149" font-size="13" font-weight="bold">【催眠核心闭环】</text>
      <text x="20" y="60" fill="#c9d1d9" font-size="11">• 核心公式：造幻 + 入幻 = 玩我</text>
      <text x="20" y="90" fill="#c9d1d9" font-size="11">• 三大循环：意识循环、小我循环、当真循环</text>
      <text x="20" y="120" fill="#c9d1d9" font-size="11">• 递归逻辑：基本意识 → 扭曲 → 植入 → 固化</text>
      <text x="20" y="150" fill="#c9d1d9" font-size="11">• 第12-13课：前11课高强度答疑与复盘</text>
      <text x="20" y="180" fill="#c9d1d9" font-size="11">• 特点：潜移默化，攻心为上，不战而屈</text>
    </g>
  </g>


  <!-- 列三：第三模块 (催眠的原则与策略：第14-16课) -->
  <g transform="translate(980, 290)">
