      <text x="20" y="120" fill="#c9d1d9" font-size="11">• 过程：有序逆向拆层 (n → n-1 → 0)</text>
      <text x="20" y="150" fill="#c9d1d9" font-size="11">• 结果：开放、不可预设变幻 (a?b?c?d?)</text>
      <text x="20" y="180" fill="#c9d1d9" font-size="11">• 关键：觉察不等于破幻，破幻需彻底出幻</text>
