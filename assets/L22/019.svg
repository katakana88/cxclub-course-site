      <circle cx="20" cy="27" r="6" fill="#3fb950" />
      <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="bold">第21课：催醒策略</text>
      <text x="40" y="42" fill="#8b949e" font-size="11">“两头开放”，恢复自由进退与自主选择</text>
    </g>
    <!-- 附加说明 -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="260" height="210" rx="8" fill="#1a2720" stroke="#2ea043" stroke-width="1" />
      <text x="20" y="30" fill="#3fb950" font-size="13" font-weight="bold">【催醒破幻核心】</text>
