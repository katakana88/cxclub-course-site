    <!-- 右侧核心公式概括框 -->
    <g transform="translate(850, 205)">
      <rect x="0" y="0" width="730" height="135" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="365" y="30" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">第1-21课全景核心公式对照总览</text>
      <text x="30" y="62" fill="#f85149" font-size="12">【催眠】造幻 + 入幻（当真 + 循环）= 玩我</text>
      <text x="30" y="87" fill="#3fb950" font-size="12">【催醒】破幻 + 出幻（不当真 + 不循环）= 我玩</text>
      <text x="30" y="112" fill="#c9d1d9" font-size="12">【递归公式】催眠: a_n → A_n+  |  催醒: A_n+ → a_n → a?b?c?d? (开放变幻)</text>
    </g>
